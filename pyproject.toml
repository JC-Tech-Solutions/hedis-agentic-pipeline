[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hedis_engine"
version = "0.1.0"
description = "HEDIS Quality Measure Gap Engine combining dbt, LangGraph, and RPA Automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.0",
    "dbt-duckdb>=1.7.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
hedis-run = "hedis_engine.main:run_pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["hedis_engine*"]
